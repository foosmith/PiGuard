name: Update Appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish to the appcast, e.g. v3.6.5"
        required: true
        type: string

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.9.1"  # Keep in sync with Package.resolved
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  update-appcast:
    # sign_update is a Mach-O binary; must run on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Checkout master scripts
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-src
          sparse-checkout: .github/scripts

      # After the checkouts: actions/checkout cleans the workspace, so
      # anything downloaded earlier would be deleted. Tools live in
      # RUNNER_TEMP to stay out of the git workspace entirely.
      - name: Download Sparkle tools
        run: |
          # Sparkle 2.7+ ships .tar.xz (older releases were .tar.bz2)
          curl -fL "https://github.com/sparkle-project/Sparkle/releases/download/${{ env.SPARKLE_VERSION }}/Sparkle-${{ env.SPARKLE_VERSION }}.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"
          chmod +x "$RUNNER_TEMP/sparkle-tools/bin/sign_update"

      - name: Download release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release event fires the moment the release is published, which
          # can be minutes before the DMG asset is uploaded. Poll for up to
          # 30 minutes instead of failing on the first miss.
          for attempt in $(seq 1 30); do
            if gh release download "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "*.dmg"; then
              break
            fi
            echo "No DMG asset yet (attempt $attempt/30); retrying in 60s..."
            sleep 60
          done
          DMG_FILE=$(ls *.dmg | head -1)
          echo "DMG_FILE=$DMG_FILE" >> $GITHUB_ENV

      - name: Extract version info from app bundle
        run: |
          SHORT_VERSION=$(echo "$DMG_FILE" | sed 's/PiGuard-\([^-]*\)-.*/\1/')
          hdiutil attach "$DMG_FILE" -mountpoint /tmp/dmg-mount -nobrowse -quiet
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" /tmp/dmg-mount/PiGuard.app/Contents/Info.plist)
          hdiutil detach /tmp/dmg-mount -quiet
          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Sign DMG
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle-tools/bin/sign_update" "$DMG_FILE" --ed-key-file - -p)
          echo "SIGNATURE=$SIGNATURE" >> $GITHUB_ENV

      - name: Get DMG file size
        run: |
          # BSD stat (macOS runner); GNU would be stat -c%s
          DMG_LENGTH=$(stat -f%z "$DMG_FILE")
          echo "DMG_LENGTH=$DMG_LENGTH" >> $GITHUB_ENV

      - name: Get release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json name,body,publishedAt > release_meta.json

          python3 -c "import json; d=json.load(open('release_meta.json')); open('RELEASE_NAME.txt','w').write(d['name']); open('release_body.txt','w').write(d['body']); open('PUB_DATE.txt','w').write(d['publishedAt'])"
          # Heredoc form prevents env-var injection via newlines in the release name
          {
            echo "RELEASE_NAME<<PIGUARD_EOF_$GITHUB_RUN_ID"
            printf '%s\n' "$(cat RELEASE_NAME.txt)"
            echo "PIGUARD_EOF_$GITHUB_RUN_ID"
            echo "PUB_DATE<<PIGUARD_EOF_$GITHUB_RUN_ID"
            printf '%s\n' "$(cat PUB_DATE.txt)"
            echo "PIGUARD_EOF_$GITHUB_RUN_ID"
          } >> "$GITHUB_ENV"

      - name: Install markdown Python package
        run: python3 -m pip install --break-system-packages markdown || python3 -m pip install markdown

      - name: Update appcast
        run: |
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$DMG_FILE"

          python3 master-src/.github/scripts/update_appcast.py \
            --appcast appcast.xml \
            --title "$RELEASE_NAME" \
            --version "$BUILD_NUMBER" \
            --short-version "$SHORT_VERSION" \
            --pub-date "$PUB_DATE" \
            --dmg-url "$DMG_URL" \
            --dmg-length "$DMG_LENGTH" \
            --signature "$SIGNATURE" \
            --release-notes-file release_body.txt

      - name: Commit and push appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast for $RELEASE_TAG"
          git push origin gh-pages
